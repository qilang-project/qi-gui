[package]
name = "qi-gui"
version = "0.1.0"
edition = "2021"
authors = ["Qi Language Team"]
description = "GUI library for Qi programming language"
license = "MIT"

[lib]
name = "qi_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Window management
tao = "0.34"

# Rendering
softbuffer = "0.4"
raw-window-handle = "0.6"

# Image loading
image = "0.25"

# Audio playback
rodio = "0.19"

# Utilities
once_cell = "1.20"

[build-dependencies]
cbindgen = "0.27"

[features]
default = []
