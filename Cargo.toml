[package]
name = "qi-gui"
version = "2026.7.24-1"
edition = "2021"
authors = ["Qi Language Team"]
description = "GUI library for Qi programming language"
license = "MIT"

[lib]
name = "qi_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Image loading（图片显示控件解码 png/jpg）
image = "0.25"

# Audio playback
rodio = "0.19"

# ── egui 控件层（immediate mode GUI，单轨架构）────────────────────
# egui 应用自带 winit 0.30 窗口后端 + softbuffer 软件呈现 + 自绘 epaint 网格
# 光栅化（不依赖 GL/GPU，跨平台稳定）。老 tao 自绘轨已彻底移除。
egui = "0.29"
egui-winit = { version = "0.29", default-features = false }
egui_plot = "0.29"
winit = "0.30"
softbuffer = "0.4"

[build-dependencies]
cbindgen = "0.27"

[features]
default = []

# Examples
[[example]]
name = "audio_player"
path = "examples/audio_player.rs"
