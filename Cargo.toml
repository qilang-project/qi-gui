[package]
name = "qi-gui"
version = "2026.8.16-1"
edition = "2021"
authors = ["Qi Language Team"]
description = "GUI library for Qi programming language"
license = "MIT"

[lib]
name = "qi_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Image loading（图片显示控件解码 png/jpg）
image = "0.25"

# Audio playback
rodio = "0.19"

# ── egui 控件层（immediate mode GUI，单轨架构）────────────────────
# egui 应用自带 winit 0.30 窗口后端 + softbuffer 软件呈现 + 自绘 epaint 网格
# 光栅化（不依赖 GL/GPU，跨平台稳定）。老 tao 自绘轨已彻底移除。
egui = "0.29"
egui-winit = { version = "0.29", default-features = false }
egui_plot = "0.29"
winit = "0.30"
softbuffer = "0.4"

# 原生文件对话框。Linux 只开 xdg-portal（D-Bus 纯 Rust，没有 portal 时退到 zenity），
# 不开默认的 wayland（要链 libwayland）也不开 gtk3 —— 不给 Linux 构建加系统依赖
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# 原生菜单栏：只在 macOS / Windows。muda 在 Linux 要 GTK，那边菜单 FFI 是空实现
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21", default-features = false }
# 系统剪贴板：egui-winit 不开剪贴板时只有进程内的假剪贴板（拷出去贴不到别的程序）。
# 只在 macOS / Windows 开 arboard；Linux 那份要 smithay-clipboard（Wayland），先不动
egui-winit = { version = "0.29", default-features = false, features = ["arboard"] }

[build-dependencies]
cbindgen = "0.27"

[features]
default = []

# Examples
[[example]]
name = "audio_player"
path = "examples/audio_player.rs"
