[package]
name = "qi-gui"
version = "2026.424.1"
edition = "2021"
authors = ["Qi Language Team"]
description = "GUI library for Qi programming language"
license = "MIT"

[lib]
name = "qi_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Window management
tao = "0.34"

# Rendering
softbuffer = "0.4"
raw-window-handle = "0.6"

# Image loading
image = "0.25"

# Audio playback
rodio = "0.19"

# Utilities
once_cell = "1.20"
tiny-skia = "0.11.4"

# 文本排版与整形（真正的字体渲染，支持 CJK，替代手写位图字体）
cosmic-text = "0.12"

# ── egui 控件层（immediate mode GUI）──────────────────────────────
# 新 API 家族，与老 40 个 FFI 并存。egui 应用自带 winit 后端 + softbuffer 软件
# 呈现 + 自绘 epaint 网格光栅化（不依赖 GL/GPU，跨平台稳定）。老 tao API 不受影响。
egui = "0.29"
egui-winit = { version = "0.29", default-features = false }
egui_plot = "0.29"
winit = "0.30"

[build-dependencies]
cbindgen = "0.27"

[features]
default = []

# Examples
[[example]]
name = "simple_window"
path = "examples/simple_window.rs"

[[example]]
name = "keyboard_demo"
path = "examples/keyboard_demo.rs"

[[example]]
name = "audio_player"
path = "examples/audio_player.rs"

[[example]]
name = "window_control"
path = "examples/window_control.rs"
