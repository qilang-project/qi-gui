# cbindgen configuration for qi-gui

language = "C"
include_guard = "QI_GUI_H"
autogen_warning = "/* Warning: This file is auto-generated by cbindgen. Do not modify. */"
include_version = true
namespace = "qi_gui"
cpp_compat = true
style = "both"

[export]
include = ["Window", "EventLoop"]

[export.rename]
"Window" = "QiWindow"
"EventLoop" = "QiEventLoop"
